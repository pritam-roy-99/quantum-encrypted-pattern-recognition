<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#f2f7fc"/><rect x="35" y="25" width="1430" height="78" rx="16" fill="#094b86"/><text x="750" y="76" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold" fill="white">Encrypted-Cloning Computation on Quantum Images</text><g font-family="Arial" font-size="23" fill="#102747" text-anchor="middle"><rect x="30" y="155" width="255" height="190" rx="16" fill="#e2eeff" stroke="#5e8dc8"/><text x="157" y="199">Quantum image</text><text x="157" y="251">|ψ⟩</text><rect x="330" y="155" width="200" height="190" rx="16" fill="#ede2fc" stroke="#9c7eca"/><text x="430" y="199">Encoding</text><text x="430" y="253">W</text><rect x="580" y="155" width="365" height="190" rx="16" fill="#e0f4ff" stroke="#5e8dc8"/><text x="762" y="199">Encrypted shares</text><text x="762" y="253">A | S₁ | S₂ | N</text><rect x="990" y="155" width="240" height="190" rx="16" fill="#ede2fc" stroke="#9c7eca"/><text x="1110" y="199">Cooperative</text><text x="1110" y="232">gate processing</text><rect x="1270" y="155" width="200" height="190" rx="16" fill="#e2eeff" stroke="#5e8dc8"/><text x="1370" y="199">Recover</text><text x="1370" y="251">Dᵢ(Sᵢ,N)</text><g font-size="33" fill="#164a83"><text x="306" y="257">→</text><text x="553" y="257">→</text><text x="966" y="257">→</text><text x="1250" y="257">→</text></g></g><g font-family="Arial" font-size="25" fill="white" font-weight="bold" text-anchor="middle"><rect x="30" y="410" width="460" height="72" rx="12" fill="#cb3846"/><rect x="520" y="410" width="460" height="72" rx="12" fill="#2379c3"/><rect x="1010" y="410" width="460" height="72" rx="12" fill="#05875e"/><text x="260" y="454">One share alone</text><text x="750" y="454">One share + key</text><text x="1240" y="454">All parties cooperate</text></g><g font-family="Arial" font-size="22" fill="#153354"><rect x="30" y="484" width="460" height="160" rx="12" fill="white" stroke="#cd838a"/><rect x="520" y="484" width="460" height="160" rx="12" fill="white" stroke="#77b0dd"/><rect x="1010" y="484" width="460" height="160" rx="12" fill="white" stroke="#75baa1"/><text x="54" y="530">Cannot generally update</text><text x="54" y="565">all recoverable clones</text><text x="544" y="530">Some correlated gates</text><text x="544" y="565">may admit logical updates</text><text x="1034" y="530">Larger gate families may</text><text x="1034" y="565">be available cooperatively</text></g><rect x="30" y="690" width="1440" height="170" rx="14" fill="#f2eafb" stroke="#987cc7"/><g font-family="Arial" font-size="22" fill="#25325b"><text x="55" y="730" font-weight="bold">Image operations: Walsh (H⊗H), SWAP transpose and CNOT-based pixel permutations</text><text x="55" y="771">Source papers: Ouyang et al., Physical Review A 96, 052333 (2017); Fisher et al., Nature Communications 5, 3074 (2014)</text><text x="55" y="812" font-size="19">Conceptual schematic, not a proven full encrypted-cloning implementation or IBM QPU result.</text></g></svg>