[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-encrypted-pattern-recognition"
version = "0.1.0"
description = "Masked quantum image-pattern recognition on Qiskit and IBM Quantum"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "qiskit>=1.2", "qiskit-aer>=0.15"]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.30"]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[project.scripts]
qepr = "qepr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
